<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengumuman | SKAWAD</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="header">
        <h1>📢 Pengumuman</h1>
        <p>SK Kampung Jawa 2</p>
    </header>

    <main class="content">

        <a href="index.html">← Kembali ke Utama</a>

        <br><br>

        <div class="welcome">
            <h2>Pengumuman Terkini</h2>
            <p>Maklumat dan pengumuman rasmi sekolah.</p>
        </div>

        <div id="announcementList"></div>

    </main>

</div>

<script src="data.js"></script>

<script>

const list = document.getElementById("announcementList");

// Announcements from data.js
const defaultAnnouncements = schoolData.announcements;

// Public announcements come only from the versioned project file.
const allAnnouncements = defaultAnnouncements;
// Display announcements
allAnnouncements.forEach(function(item) {

    const announcement = document.createElement("div");

    announcement.className = "announcement";

    const title = document.createElement("h3");
    title.textContent = item.title;

    const date = document.createElement("small");
    date.textContent = "📅 " + item.date + " • " + item.category;

    const message = document.createElement("p");
    message.textContent = item.message;

    announcement.appendChild(title);
    announcement.appendChild(date);
    announcement.appendChild(message);

    list.appendChild(announcement);

});

// Preserve local previews, but never present browser storage as shared school data.
try {
    const drafts = JSON.parse(localStorage.getItem("skawadAnnouncements") || "[]");
    if (Array.isArray(drafts) && drafts.length) {
        const heading = document.createElement("h2");
        heading.textContent = "Draf tempatan — pelayar ini sahaja (belum diterbitkan)";
        list.appendChild(heading);
        drafts.forEach(item => {
            if (!item || ![item.title, item.date, item.category, item.message].every(value => typeof value === "string")) return;
            const draft = document.createElement("div");
            draft.className = "announcement";
            const title = document.createElement("h3");
            title.textContent = item.title;
            const detail = document.createElement("p");
            detail.textContent = item.date + " • " + item.category + " — " + item.message;
            draft.append(title, detail);
            list.appendChild(draft);
        });
    }
} catch (error) {
    // Corrupt or unavailable browser storage must not hide public announcements.
}

</script>

</body>
</html>
