<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#073b78">
    <title>Pengumuman | SKAWAD AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="home announcements-page">
    <header class="announcements-header">
        <div class="home-shell announcements-header-content">
            <a class="announcements-back" href="index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m12 5-7 7 7 7M5 12h14"/>
                </svg>
                Kembali ke Utama
            </a>
            <div class="announcements-identity">
                <span class="home-icon home-icon-pink">
                    <svg viewBox="0 0 48 48" aria-hidden="true">
                        <path d="m10 27 5 12a4 4 0 0 0 7-3l-4-9" fill="#b92463"/>
                        <path d="M6 19h11l17-9v23l-17-6H6a4 4 0 0 1 0-8" fill="#f15991"/>
                        <ellipse cx="34" cy="21" rx="4" ry="12" fill="#c52568"/>
                        <path d="m40 14 4-3m-3 10h5m-6 6 4 3" fill="none" stroke="#d43e7c" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                </span>
                <div>
                    <h1>Pengumuman</h1>
                    <p>SK Kampung Jawa 2</p>
                </div>
            </div>
        </div>
        <svg class="home-wave announcements-wave" viewBox="0 0 1200 95" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0 45c200 38 386 48 609 19 229-29 409-79 591-61v92H0Z" fill="#65b9fa" opacity=".5"/>
            <path d="M0 69c243 36 432 27 632 1 213-28 401-56 568-33v58H0Z" fill="#c5e3ff"/>
            <path d="M0 81c224 20 429 16 637-6 215-23 388-40 563-22v42H0Z" fill="#e5f2ff"/>
        </svg>
    </header>

    <main class="home-shell announcements-main announcement-feed">
        <section aria-labelledby="published-heading">
            <h2 id="published-heading">Pengumuman Rasmi</h2>
            <section class="announcement-section" aria-labelledby="current-heading">
                <h3 id="current-heading">Pengumuman Terkini</h3>
                <div id="announcementList" class="announcements-grid"></div>
                <p id="current-empty" class="announcement announcement-empty" hidden>Tiada pengumuman terkini.</p>
            </section>
            <section class="announcement-section" aria-labelledby="archive-heading">
                <h3 id="archive-heading">Arkib Pengumuman</h3>
                <div id="archiveList" class="announcements-grid"></div>
                <p id="archive-empty" class="announcement announcement-empty" hidden>Tiada pengumuman dalam arkib.</p>
            </section>
        </section>
        <section id="local-drafts" aria-labelledby="drafts-heading" hidden>
            <h2 id="drafts-heading">Draf tempatan</h2>
            <p>Draf ini hanya kelihatan dalam pelayar ini dan belum diterbitkan.</p>
            <div id="draftList" class="announcements-grid"></div>
        </section>
    </main>

    <script src="data.js"></script>
    <script src="knowledge.js"></script>
    <script>
        function textElement(tag, text, className) {
            const element = document.createElement(tag);
            element.textContent = text;
            if (className) element.className = className;
            return element;
        }

        function groupAnnouncements(items) {
            const groups = new Map();
            const normalize = value => value.normalize("NFKC").trim().toLowerCase().replace(/\s+/g, " ");
            for (const item of items) {
                const dates = schoolDateRange(item.date);
                const period = dates ? dates.start + "/" + dates.end : normalize(item.date);
                const title = normalize(item.title);
                const message = normalize(item.message);
                const key = JSON.stringify([period, item.eventId || null, item.eventId ? null : title,
                    item.eventId ? null : message]);
                const group = groups.get(key) || { dates, records: [] };
                if (!group.records.some(record => normalize(record.message) === message)) {
                    group.records.push(item);
                }
                groups.set(key, group);
            }
            return groups.values();
        }

        function hasExpiredEvent({ dates, records }, today) {
            // A dated notice without an event ID may carry a publication date only.
            return !!(records[0].eventId && dates && dates.end < today);
        }

        function makeCard(group, today, isDraft = false) {
            const { dates, records } = group;
            const [first, ...related] = records;
            const card = document.createElement("article");
            card.className = "announcement";
            const title = textElement(isDraft ? "h3" : "h4", first.title, "announcement-title");
            const meta = document.createElement("div");
            meta.className = "announcement-meta";
            const date = textElement(dates && dates.start === dates.end ? "time" : "span", first.date);
            if (date.tagName === "TIME") date.dateTime = dates.start;
            meta.append(date, textElement("span", [...new Set(records.map(item => item.category))].join(" · "),
                "announcement-category"));
            card.append(title, meta);

            const pastEvent = !isDraft && hasExpiredEvent(group, today);
            const originalCopy = document.createElement(pastEvent ? "blockquote" : "div");
            originalCopy.className = "announcement-copy";
            if (pastEvent) {
                card.append(textElement("p", "Arkib acara · Tarikh yang dijadualkan telah berlalu. Pelaksanaan acara belum disahkan.",
                    "announcement-history"));
                originalCopy.append(textElement("p", "Petikan pengumuman asal", "announcement-quote-label"));
            }
            originalCopy.append(textElement("p", first.message));
            for (const item of related) {
                const note = document.createElement("div");
                note.className = "announcement-related";
                note.append(textElement("h5", item.title), textElement("p", item.message));
                originalCopy.append(note);
            }
            card.append(originalCopy);
            return card;
        }

        function renderPublishedAnnouncements(items, today) {
            const current = document.createDocumentFragment();
            const archive = document.createDocumentFragment();
            for (const group of groupAnnouncements(items)) {
                const list = hasExpiredEvent(group, today) ? archive : current;
                list.append(makeCard(group, today));
            }
            document.getElementById("current-empty").hidden = !!current.childElementCount;
            document.getElementById("archive-empty").hidden = !!archive.childElementCount;
            document.getElementById("announcementList").replaceChildren(current);
            document.getElementById("archiveList").replaceChildren(archive);
        }

        const dateInMalaysia = new Intl.DateTimeFormat("sv-SE", { timeZone: "Asia/Kuala_Lumpur",
            year: "numeric", month: "2-digit", day: "2-digit" });
        function refreshPublishedAnnouncements() {
            renderPublishedAnnouncements(schoolData.announcements, dateInMalaysia.format(new Date()));
        }
        refreshPublishedAnnouncements();
        window.addEventListener("pageshow", event => {
            if (event.persisted) refreshPublishedAnnouncements();
        });
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) refreshPublishedAnnouncements();
        });

        // Browser drafts remain separate from the school's published records.
        try {
            const stored = JSON.parse(localStorage.getItem("skawadAnnouncements") || "[]");
            const drafts = Array.isArray(stored) ? stored.filter(item => item &&
                [item.title, item.date, item.category, item.message].every(value => typeof value === "string")) : [];
            if (drafts.length) {
                const draftList = document.getElementById("draftList");
                for (const item of drafts) draftList.append(makeCard({ records: [item] }, null, true));
                document.getElementById("local-drafts").hidden = false;
            }
        } catch {
            // Unavailable or invalid storage does not affect published announcements.
        }
    </script>
</body>
</html>
