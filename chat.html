
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanya SKAWAD AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="header">
        <h1>🤖 SKAWAD AI</h1>
        <p>Pembantu Informasi Pintar Sekolah</p>
    </header>

    <main class="content">

        <a class="announcements-back portal-home" href="index.html">← Kembali ke Utama</a>

        <div class="welcome" style="margin-top:25px;">
            <h2>Tanya SKAWAD AI 💬</h2>
            <p>
                Hai! Saya pembantu maya SKAWAD.
                Ada apa-apa soalan tentang sekolah?
            </p>
        </div>

        <div id="chatMessages" class="chat-messages" role="log" aria-live="polite" aria-label="Perbualan SKAWAD">

            <div class="bot-message">
                👋 Assalamualaikum dan salam sejahtera!
                Saya SKAWAD AI. Apa yang boleh saya bantu?
            </div>

        </div>

<div class="suggested-questions">
    <p><strong>💡 Soalan Cadangan</strong></p>

    <button type="button" onclick="askSuggestion('Ada pengumuman terkini?')">
        📢 Pengumuman Terkini
    </button>

    <button type="button" onclick="askSuggestion('Bila perkhemahan?')">
        🏕️ Perkhemahan
    </button>

    <button type="button" onclick="askSuggestion('Apa nama sekolah?')">
        🏫 Info Sekolah
    </button>
</div>



        <form id="chatForm" class="chat-form">

            <input
                type="text"
                id="userInput" aria-label="Soalan anda" maxlength="1000"
                placeholder="Taip soalan anda..."
                autocomplete="off"
                required
            >

            <button type="submit" class="admin-submit">
                ➤ Hantar
            </button>

        </form>

    </main>

</div>

<script src="data.js"></script>

<script src="knowledge.js"></script>
<script src="chatbot.js"></script>
</body>
</html>
