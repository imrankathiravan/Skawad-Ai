<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#073b78">
    <title>Tanya SKAWAD AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="chat-page">
    <main class="chat-screen">
        <header class="chat-topbar">
            <a class="announcements-back chat-back" href="index.html" aria-label="Kembali ke Utama">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 12H5m7 7-7-7 7-7"/>
                </svg>
            </a>
            <span class="chat-avatar" aria-hidden="true">
                <svg viewBox="0 0 32 32" fill="none">
                    <path d="M16 9V5M6 15H4v6h2m20-6h2v6h-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="16" cy="4" r="2" fill="#83d5ff"/>
                    <rect x="6" y="9" width="20" height="17" rx="6" fill="#fff"/>
                    <rect x="9" y="13" width="14" height="9" rx="4" fill="#073b78"/>
                    <path d="M12 17h1m6 0h1m-6 2c1.2 1 2.8 1 4 0" stroke="#83d5ff" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
            </span>
            <div>
                <h1>SKAWAD AI</h1>
                <p>Pembantu Pintar Sekolah</p>
            </div>
        </header>

        <div id="chatMessages" class="chat-messages" role="log" aria-live="polite"
             aria-label="Perbualan SKAWAD" tabindex="0">
            <div class="bot-message">Assalamualaikum dan salam sejahtera! 👋

Saya SKAWAD AI, pembantu pintar SK Kampung Jawa 2.

Apa yang boleh saya bantu hari ini?</div>
        </div>

        <footer class="chat-composer">
            <section class="suggested-questions" aria-labelledby="chat-suggestions-title">
                <h2 id="chat-suggestions-title">Soalan cadangan</h2>
                <div class="chat-suggestions-list">
                    <button type="button" onclick="askSuggestion('Ada pengumuman terkini?')">Pengumuman Terkini</button>
                    <button type="button" onclick="askSuggestion('Bila perkhemahan?')">Perkhemahan</button>
                    <button type="button" onclick="askSuggestion('Apa nama sekolah?')">Info Sekolah</button>
                </div>
            </section>
            <form id="chatForm" class="chat-form">
                <input type="text" id="userInput" aria-label="Soalan anda" maxlength="1000"
                       placeholder="Tanya apa-apa tentang sekolah..." autocomplete="off" enterkeyhint="send" required>
                <button type="submit" class="chat-send" aria-label="Hantar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 19V5m-6 6 6-6 6 6"/>
                    </svg>
                </button>
            </form>
        </footer>
    </main>

    <script src="data.js"></script>
    <script src="knowledge.js"></script>
    <script src="chatbot.js"></script>
</body>
</html>
